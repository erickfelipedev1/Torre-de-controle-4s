<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Torre de Controle 4S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#f4f5fa;
  --bg-grid: rgba(20,24,38,0.035);
  --surface:#ffffff;
  --surface-2:#eef0f5;
  --surface-raised:#ffffff;
  --border:#dfe2ea;
  --border-soft:#e9ebf1;
  --text:#171a23;
  --text-muted:#5b6172;
  --text-dim:#8890a0;
  --accent:#c2540f;
  --accent-soft:#fdece0;
  --accent-glow: rgba(255,138,61,0.18);
  --violet:#6a56d6;
  --violet-soft:#efecfc;
  --topo:#0f8f8a;
  --topo-soft:#e2f6f4;
  --meio:#6a56d6;
  --meio-soft:#efecfc;
  --fundo:#c2453a;
  --fundo-soft:#fbe9e7;
  --good:#1a8a5e;
  --warn:#b9791a;
  --pink:#c22a6b;
  --pink-soft:#fbe3ee;
  --cyan:#0f7fa8;
  --cyan-soft:#e1f2f9;
  --gold:#96690a;
  --gold-soft:#faf0d8;
  --shadow: 0 1px 2px rgba(20,24,38,.04), 0 8px 24px rgba(20,24,38,.06);
  --radius-s:9px;
  --radius-m:16px;
  --radius-l:22px;
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060814;
    --bg-grid: rgba(255,255,255,0.045);
    --surface:#10142a;
    --surface-2:#161b38;
    --surface-raised:#181e40;
    --border:#262e54;
    --border-soft:#1a1f3c;
    --text:#f3f5fc;
    --text-muted:#9aa2c4;
    --text-dim:#636b90;
    --accent:#ff8a3d;
    --accent-soft:rgba(255,138,61,0.16);
    --accent-glow: rgba(255,138,61,0.42);
    --violet:#8b7cf6;
    --violet-soft:rgba(139,124,246,0.16);
    --topo:#2dd4bf;
    --topo-soft:rgba(45,212,191,0.16);
    --meio:#8b7cf6;
    --meio-soft:rgba(139,124,246,0.16);
    --fundo:#f0685a;
    --fundo-soft:rgba(240,104,90,0.16);
    --good:#3ddc97;
    --warn:#f0b843;
    --pink:#ff4d92;
    --pink-soft:rgba(255,77,146,0.16);
    --cyan:#3ad2ff;
    --cyan-soft:rgba(58,210,255,0.16);
    --gold:#ffcf5c;
    --gold-soft:rgba(255,207,92,0.18);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 70px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#060814;
  --bg-grid: rgba(255,255,255,0.045);
  --surface:#10142a;
  --surface-2:#161b38;
  --surface-raised:#181e40;
  --border:#262e54;
  --border-soft:#1a1f3c;
  --text:#f3f5fc;
  --text-muted:#9aa2c4;
  --text-dim:#636b90;
  --accent:#ff8a3d;
  --accent-soft:rgba(255,138,61,0.16);
  --accent-glow: rgba(255,138,61,0.42);
  --violet:#8b7cf6;
  --violet-soft:rgba(139,124,246,0.16);
  --topo:#2dd4bf;
  --topo-soft:rgba(45,212,191,0.16);
  --meio:#8b7cf6;
  --meio-soft:rgba(139,124,246,0.16);
  --fundo:#f0685a;
  --fundo-soft:rgba(240,104,90,0.16);
  --good:#3ddc97;
  --warn:#f0b843;
  --pink:#ff4d92;
  --pink-soft:rgba(255,77,146,0.16);
  --cyan:#3ad2ff;
  --cyan-soft:rgba(58,210,255,0.16);
  --gold:#ffcf5c;
  --gold-soft:rgba(255,207,92,0.18);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html{color-scheme:light dark;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 14% -10%, var(--accent-glow), transparent 42%),
    radial-gradient(circle at 88% 4%, rgba(139,124,246,0.12), transparent 40%),
    linear-gradient(var(--bg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: auto, auto, 34px 34px, 34px 34px;
  background-attachment: fixed;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance;}
p{margin:0;}
::selection{background:var(--accent); color:#fff;}
.mono{font-family:var(--font-mono);}
.tabular{font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ SHELL ============ */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:22px 16px; gap:26px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:11px; padding:0 6px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; flex:none;
  background: conic-gradient(from 220deg, var(--accent), var(--violet), var(--accent));
  position:relative; box-shadow:0 0 0 1px var(--border-soft), 0 0 0 4px var(--accent-soft), 0 6px 18px var(--accent-glow);
}
.brand-mark::after{
  content:""; position:absolute; inset:5px; border-radius:6px; background:var(--surface);
  clip-path: polygon(50% 8%, 88% 90%, 50% 68%, 12% 90%);
}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.01em;}
.brand-sub{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:1px;}

.navlist{display:flex; flex-direction:column; gap:3px;}
.navlink{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:var(--text-muted); font-size:13.5px; font-weight:500; border:1px solid transparent;
  background:transparent; text-align:left; width:100%; transition:background .12s, color .12s;
}
.navlink svg{width:17px; height:17px; flex:none; opacity:.85;}
.navlink:hover{background:var(--surface-2); color:var(--text);}
.navlink.active{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600; box-shadow:0 0 0 1px var(--accent-soft), 0 4px 14px var(--accent-glow);}
.navlink.active svg{opacity:1;}
.nav-spacer{flex:1;}
.sidebar-foot{border-top:1px solid var(--border-soft); padding-top:14px; font-size:11.5px; color:var(--text-dim);}
.sidebar-foot b{color:var(--text-muted); font-weight:600;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:14px 30px;
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
}
.topbar-title{margin-right:auto;}
.topbar-title h1{font-size:16px; font-weight:700;}
.topbar-title span{font-size:11.5px; color:var(--text-dim);}
.snap{display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12px;}
.snap .dot{width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent);}
.snap b{font-family:var(--font-mono); font-weight:600;}
.live-badge{display:flex; align-items:center; gap:7px; padding:6px 12px 6px 10px; border-radius:999px; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);}
.live-badge .pulse{width:7px; height:7px; border-radius:50%; background:var(--accent); position:relative; flex:none;}
.live-badge .pulse::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--accent); animation:livepulse 1.8s ease-out infinite;}
@keyframes livepulse{0%{transform:scale(.5); opacity:.9;} 100%{transform:scale(1.9); opacity:0;}}
.live-badge b{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; color:var(--accent); font-weight:700;}
.live-clock{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
.live-clock b{color:var(--text-muted); font-weight:600;}
.theme-toggle{
  border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:5px; display:flex; gap:2px;
}
.theme-toggle button{border:none; background:transparent; border-radius:999px; padding:5px 10px; font-size:11px; color:var(--text-dim); font-weight:600;}
.theme-toggle button.on{background:var(--text); color:var(--bg);}

.content{padding:26px 30px 60px; max-width:1360px; width:100%; margin:0 auto;}
.view{display:none; animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ============ SHARED COMPONENTS ============ */
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
.section-head h2{font-size:19px; font-weight:700;}
.section-head p{color:var(--text-muted); font-size:12.5px; max-width:560px; margin-top:4px;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:6px; display:block;}

.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.kpi{
  background:linear-gradient(180deg, var(--surface-raised), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px 18px 16px;
  position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.kpi::before{content:""; position:absolute; top:0; left:0; right:0; height:2.5px; background:var(--kpi-c, var(--accent)); box-shadow:0 0 12px 0 var(--kpi-c, var(--accent-glow));}
.kpi .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.kpi .val{font-family:var(--font-mono); font-size:27px; font-weight:700; margin-top:8px; letter-spacing:-.01em; color:var(--kpi-c, var(--text));}
.kpi .val small{font-size:13px; color:var(--text-dim); font-weight:500;}
.kpi .delta{font-size:11.5px; margin-top:6px; color:var(--text-muted);}
.kpi .delta.up{color:var(--good);} .kpi .delta.warn{color:var(--warn);}
.goal-bar{margin-top:11px; height:8px; border-radius:999px; background:var(--surface-2); position:relative; overflow:visible;}
.goal-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--violet)); overflow:hidden;}
.goal-bar span{position:absolute; top:50%; width:13px; height:13px; border-radius:50%; background:var(--text); border:2px solid var(--bg); transform:translate(-50%,-50%); box-shadow:0 0 0 3px var(--accent-glow); z-index:2;}
.goal-bar b.goal-90{position:absolute; top:-9px; width:2px; height:26px; background:var(--gold); border-radius:1px; box-shadow:0 0 8px var(--gold); transform:translateX(-50%); z-index:1;}
.goal-bar b.goal-90::after{content:"meta 90d"; position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:8.5px; font-weight:700; letter-spacing:.03em; color:var(--gold); white-space:nowrap;}
.tag-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.tag-topo{background:var(--topo-soft); color:var(--topo);}
.tag-meio{background:var(--meio-soft); color:var(--meio);}
.tag-fundo{background:var(--fundo-soft); color:var(--fundo);}
.tag-misto{background:var(--surface-2); color:var(--text-dim);}
.tag-organico{background:var(--accent-soft); color:var(--accent);}
.tag-pink{background:var(--pink-soft); color:var(--pink);}
.tag-cyan{background:var(--cyan-soft); color:var(--cyan);}
.tag-gold{background:var(--gold-soft); color:var(--gold);}

.card{background:linear-gradient(180deg, var(--surface-raised), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow);}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.callout{
  border:1px solid var(--border); border-left:3px solid var(--accent); background:var(--accent-soft);
  border-radius:0 var(--radius-m) var(--radius-m) 0; padding:14px 16px; font-size:12.8px; color:var(--text);
}
.callout b{color:var(--accent);}

/* charts */
.chart-card{padding:18px 20px 14px;}
.chart-card h3{font-size:13px; font-weight:600;}
.chart-card .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px; margin-bottom:12px;}
svg text{font-family:var(--font-mono); fill:var(--text-dim);}
.axis-line{stroke:var(--border); stroke-width:1;}
.legend{display:flex; gap:14px; font-size:11px; color:var(--text-muted); margin-top:10px; flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);}
td{padding:9px 10px; border-bottom:1px solid var(--border-soft);}
tr:last-child td{border-bottom:none;}

/* ============ PLANO 30 DIAS ============ */
.plan-controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--border); background:var(--surface); color:var(--text-muted); border-radius:999px;
  padding:6px 13px; font-size:12px; font-weight:600;
}
.chip.on{background:var(--text); color:var(--bg); border-color:var(--text);}
.chip.on[data-f="topo"]{background:var(--topo); border-color:var(--topo); color:#04211f;}
.chip.on[data-f="meio"]{background:var(--meio); border-color:var(--meio); color:#fff;}
.chip.on[data-f="fundo"]{background:var(--fundo); border-color:var(--fundo); color:#fff;}
.plan-meta{margin-left:auto; font-size:11.5px; color:var(--text-dim);}

.week-block{margin-bottom:22px;}
.week-title{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:9px; display:flex; align-items:center; gap:8px;}
.week-title::after{content:""; flex:1; height:1px; background:var(--border-soft);}
.day-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px;}
.day-card{
  text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:13px 14px 12px; display:flex; flex-direction:column; gap:8px; position:relative; transition:transform .12s, border-color .12s;
}
.day-card:hover{transform:translateY(-2px); border-color:var(--accent);}
.day-card::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:var(--dc, var(--topo));}
.day-card .dc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.day-card .date{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
.day-card .fmt{font-size:10.5px; color:var(--text-dim); display:flex; align-items:center; gap:4px;}
.day-card h4{font-size:13px; font-weight:600; line-height:1.35;}
.day-card .hook-prev{font-size:11.5px; color:var(--text-muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.day-card .dc-bot{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
.note-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); display:none;}
.note-dot.on{display:block;}
.day-card.is-today{border-color:var(--good); box-shadow:0 0 0 1px var(--good), 0 0 0 5px color-mix(in srgb, var(--good) 14%, transparent), var(--shadow);}
.day-card.is-past{opacity:.6;}
.day-card.is-past:hover{opacity:1;}
.today-pill{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--good); color:#04211f; font-size:9px; font-weight:700; letter-spacing:.05em; font-family:var(--font-mono); vertical-align:middle;}

/* ============ OVERLAY ============ */
.overlay{position:fixed; inset:0; z-index:100; display:none;}
.overlay.open{display:block;}
.overlay-bg{position:absolute; inset:0; background:rgba(6,7,12,.55); backdrop-filter:blur(2px);}
.overlay-panel{
  position:absolute; top:0; right:0; height:100%; width:min(560px,100%); background:var(--surface);
  border-left:1px solid var(--border); box-shadow:-20px 0 60px rgba(0,0,0,.25); overflow-y:auto;
  transform:translateX(100%); transition:transform .22s ease;
}
.overlay.open .overlay-panel{transform:translateX(0);}
.op-head{padding:22px 26px 16px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--surface); z-index:2;}
.op-close{position:absolute; top:18px; right:20px; width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); font-size:15px; display:flex; align-items:center; justify-content:center;}
.op-tags{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
.op-head h3{font-size:17px; font-weight:700; padding-right:36px;}
.op-head .op-date{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-top:4px;}
.op-body{padding:20px 26px 30px; display:flex; flex-direction:column; gap:18px;}
.op-block .op-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); font-weight:700; margin-bottom:6px; display:block;}
.op-hook{font-family:var(--font-display); font-size:16px; font-weight:600; line-height:1.4; color:var(--text); background:var(--accent-soft); border-radius:var(--radius-s); padding:12px 14px; border-left:3px solid var(--accent);}
.op-text{font-size:13px; color:var(--text-muted); line-height:1.6;}
.op-cta{font-size:13px; font-weight:600; color:var(--violet); background:var(--violet-soft); display:inline-block; padding:8px 12px; border-radius:8px;}
.op-field{width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:12.5px; resize:vertical;}
.op-field:focus{outline:2px solid var(--accent); outline-offset:1px;}
.op-sync{font-size:10.5px; color:var(--text-dim); display:flex; align-items:center; gap:5px; margin-top:6px;}
.op-sync .dot{width:5px; height:5px; border-radius:50%; background:var(--good);}
.op-sync.local .dot{background:var(--text-dim);}

/* ============ ORIENTACOES / COMPETITORS ============ */
.comp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
.comp-card{padding:18px; display:flex; flex-direction:column; gap:8px;}
.comp-card.self{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow);}
.comp-card h4{font-size:14.5px;}
.comp-card .badge{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
.comp-card p{font-size:12px; color:var(--text-muted); line-height:1.55;}

.checklist{display:flex; flex-direction:column; gap:9px;}
.checklist li{list-style:none; display:flex; gap:10px; align-items:flex-start; font-size:12.8px; color:var(--text-muted);}
.checklist .num{font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:700; flex:none; width:20px;}

.tab-hint{display:none;}
@media(max-width:980px){
  .sidebar{position:fixed; left:0; bottom:0; top:auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; padding:10px 12px; z-index:30; border-right:none; border-top:1px solid var(--border);}
  .brand,.sidebar-foot,.nav-spacer{display:none;}
  .navlist{flex-direction:row; gap:4px;}
  .navlink{flex-direction:column; gap:3px; font-size:10px; padding:7px 10px; white-space:nowrap;}

function drawPulse30(){
  const svg = document.getElementById("chartPulse30"); if(!svg) return;
  const W=900,H=180,padL=44,padR=14,padT=14,padB=26;
  const vals = REACH_30D.map(r=>r.v);
  const max = Math.max(...vals)*1.1, min = Math.min(...vals)*0.9;
  const xs=(i)=> padL + i*((W-padL-padR)/(REACH_30D.length-1));
  const ys=(v)=> H-padB - ((v-min)/(max-min))*(H-padT-padB);
  let area = `M${xs(0)},${H-padB} `;
  REACH_30D.forEach((r,i)=>{ area += `L${xs(i)},${ys(r.v)} `; });
  area += `L${xs(REACH_30D.length-1)},${H-padB} Z`;
  let line = "";
  REACH_30D.forEach((r,i)=>{ line += (i===0?"M":"L")+xs(i)+","+ys(r.v)+" "; });
  let s = `<defs><linearGradient id="pulseFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
  </linearGradient></defs>`;
  s += `<line class="axis-line" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/>`;
  [0,0.5,1].forEach(f=>{ const y=H-padB-f*(H-padT-padB); const val=Math.round(min+f*(max-min));
    s += `<line class="axis-line" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke-dasharray="2,3"/><text x="${padL-8}" y="${y+3}" font-size="9" text-anchor="end">${fmtK(val)}</text>`; });
  REACH_30D.forEach((r,i)=>{ if(i%4===0) s+=`<text x="${xs(i)}" y="${H-8}" font-size="8.5" text-anchor="middle">${r.d}</text>`; });
  s += `<path d="${area}" fill="url(#pulseFill)"/>`;
  s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>`;
  const lastI = REACH_30D.length-1;
  s += `<circle cx="${xs(lastI)}" cy="${ys(REACH_30D[lastI].v)}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
  svg.innerHTML = s;
}

function drawQuarters(){
  const svg = document.getElementById("chartQuarters"); if(!svg) return;
  const W=620,H=220,padL=34,padR=22,padT=14,padB=26;
  const all=[...Q_REELS,...Q_CARR,...Q_IMG].filter(v=>v!=null);
  const max=Math.max(...all)*1.12;
  const xs=(i)=> padL + i*((W-padL-padR)/(QUARTERS.length-1));
  const ys=(v)=> H-padB - (v/max)*(H-padT-padB);
  function path(arr){
    let d=""; let started=false;
    arr.forEach((v,i)=>{ if(v==null) return; const x=xs(i),y=ys(v); d += (started? "L":"M")+x+","+y+" "; started=true; });
    return d;
  }
  let s = `<line class="axis-line" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/>`;
  QUARTERS.forEach((q,i)=>{ s+=`<text x="${xs(i)}" y="${H-8}" font-size="9.5" text-anchor="middle">${q}</text>`; });
  [0,0.5,1].forEach(f=>{ const y=H-padB-f*(H-padT-padB); s+=`<line class="axis-line" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke-dasharray="2,3"/><text x="${padL-6}" y="${y+3}" font-size="9" text-anchor="end">${Math.round(f*max)}</text>`; });
  function series(arr,color){
    let out = `<path d="${path(arr)}" fill="none" stroke="${color}" stroke-width="2.2"/>`;
    arr.forEach((v,i)=>{ if(v==null) return; out+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="3" fill="${color}"/>`; });
    return out;
  }
  s += series(Q_REELS,"var(--accent)");
  s += series(Q_CARR,"var(--violet)");
  s += series(Q_IMG,"var(--text-dim)");
  const worstI = 2;
  s += `<rect x="${xs(worstI)-16}" y="${padT}" width="32" height="${H-padT-padB}" fill="var(--fundo)" opacity="0.08"/>`;
  s += `<text x="${xs(worstI)}" y="${padT+10}" font-size="9" text-anchor="middle" fill="var(--fundo)">pior tri.</text>`;
  svg.innerHTML = s;
}

function drawCadence(){
  const svg = document.getElementById("chartCadence"); if(!svg) return;
  const W=320,H=220,padL=22,padR=6,padT=10,padB=22;
  const max = Math.max(...CADENCE)*1.15;
  const bw = (W-padL-padR)/CADENCE.length;
  let s = `<line class="axis-line" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/>`;
  CADENCE.forEach((v,i)=>{
    const h=(v/max)*(H-padT-padB); const x=padL+i*bw+1; const y=H-padB-h;
    const c = i>=12 ? "var(--accent)" : "var(--border)";
    s += `<rect x="${x}" y="${y}" width="${bw-2}" height="${h}" fill="${c}" rx="1.5"/>`;
    if(i%3===0) s += `<text x="${x+bw/2}" y="${H-8}" font-size="8" text-anchor="middle">${MONTHS[i].slice(0,3)}</text>`;
  });
  s += `<text x="${W-padR}" y="${padT+4}" font-size="8.5" text-anchor="end" fill="var(--text-dim)">posts/mês</text>`;
  svg.innerHTML = s;
}

function drawReach(){
  const svg = document.getElementById("chartReach"); if(!svg) return;
  const W=620,H=200,padL=30,padR=10,padT=14,padB=24;
  const max = Math.max(...REACH_M)*1.1;
  const bw = (W-padL-padR)/REACH_M.length;
  let s = `<line class="axis-line" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/>`;
  REACH_M.forEach((v,i)=>{
    const h=(v/max)*(H-padT-padB); const x=padL+i*bw+1; const y=H-padB-h;
    const paid = i>=11; // dez/25 em diante = fase de mídia paga contínua
    s += `<rect x="${x}" y="${y}" width="${bw-2}" height="${h}" fill="${paid?'var(--violet)':'var(--topo)'}" rx="1.5" opacity="0.9"/>`;
    if(i%3===0) s += `<text x="${x+bw/2}" y="${H-8}" font-size="8" text-anchor="middle">${MONTHS[i].slice(0,3)}</text>`;
  });
  svg.innerHTML = s;
}

// plan runs entirely within 2026 (07/09–06/10/2026) — safe to hardcode the year for date compare
function planDateObj(d){
  const [dd,mm] = d.date.split("/").map(Number);
  return new Date(2026, mm-1, dd);
}
function dayStatus(d){
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dMid = planDateObj(d);
  if(dMid.getTime()===todayMid.getTime()) return "hoje";
  return dMid.getTime()<todayMid.getTime() ? "passado" : "futuro";
}

function fmtIcon(fmt){
  return fmt==="Reel"
   ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>`
   : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="14" rx="2"/><rect x="8" y="4" width="14" height="14" rx="2"/></svg>`;
}

<script>
/* ============================================================
   OVERLAY (roteiro completo + notas persistidas)
   ============================================================ */
let dbCap = null;
let currentItem = null;
const localNotes = {}; // fallback in-memory quando db não está disponível

async function initDb(){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      dbCap = await window.claude.use("db");
    }
  }catch(e){ dbCap = null; }
  // depois de resolver, atualiza os pontinhos que já estão na tela
  [...DAYS30,...STORIES].forEach(d=>refreshDot(d.id));
}

function findItem(id,type){
  return type==="day" ? DAYS30.find(d=>d.id===id) : STORIES.find(s=>s.id===id);
}

async function refreshDot(id){
  const dot = document.getElementById("dot-"+id); if(!dot) return;
  let has = !!(localNotes[id] && (localNotes[id].link || localNotes[id].notes));
  if(dbCap){
    try{ const doc = await dbCap.doc("notes/"+id).get(); if(doc && doc.data && (doc.data.link || doc.data.notes)) has = true; }catch(e){}
  }
  dot.classList.toggle("on", has);
}

function openDetail(id, type){
  currentItem = {id, type};
  const d = findItem(id, type);
  const panel = document.getElementById("overlayPanel");
  const isDay = type==="day";
  panel.innerHTML = `
    <div class="op-head">
      <button class="op-close" id="opClose">✕</button>
      <div class="op-tags">
        <span class="tag-pill tag-${d.funnel}">${d.funnel}</span>
        <span class="tag-pill tag-misto">${isDay? d.fmt : d.frames.split(" — ")[0]}</span>
      </div>
      <h3>${d.title}</h3>
      <div class="op-date">${isDay ? (d.wd+" · "+d.date+" · "+d.week) : d.rhythm}</div>
    </div>
    <div class="op-body">
      <div class="op-block"><span class="op-label">Objetivo</span><p class="op-text">${isDay? d.obj : d.rhythm}</p></div>
      <div class="op-block"><span class="op-label">Hook</span><div class="op-hook">${d.hook}</div></div>
      <div class="op-block"><span class="op-label">Desenvolvimento</span><p class="op-text">${d.dev}</p></div>
      <div class="op-block"><span class="op-label">CTA</span><div class="op-cta">${d.cta}</div></div>
      ${!isDay? `<div class="op-block"><span class="op-label">Sequência de quadros</span><p class="op-text">${d.frames}</p></div>` : ""}
      <div class="op-block">
        <span class="op-label">Link de referência</span>
        <input class="op-field" id="opLink" type="url" placeholder="https://..." />
      </div>
      <div class="op-block">
        <span class="op-label">Anotações da equipe</span>
        <textarea class="op-field" id="opNotes" rows="4" placeholder="Ex.: gravado em 08/09, trocar gancho na próxima..."></textarea>
        <div class="op-sync" id="opSync"><span class="dot"></span><span id="opSyncTxt">carregando…</span></div>
      </div>
    </div>
  `;
  document.getElementById("opClose").onclick = closeDetail;
  loadNotes(id);
  document.getElementById("opLink").addEventListener("change", ()=>saveNotes(id));
  document.getElementById("opNotes").addEventListener("blur", ()=>saveNotes(id));
  document.getElementById("overlay").classList.add("open");
}
function closeDetail(){ document.getElementById("overlay").classList.remove("open"); }
document.getElementById("overlayBg").onclick = closeDetail;

async function loadNotes(id){
  const syncEl = document.getElementById("opSync");
  const syncTxt = document.getElementById("opSyncTxt");
  let data = localNotes[id] || {};
  if(dbCap){
    try{
      const doc = await dbCap.doc("notes/"+id).get();
      if(doc && doc.data){ data = doc.data; }
      syncEl.classList.remove("local"); syncTxt.textContent = "sincronizado com a equipe";
      dbCap.doc("notes/"+id).onSnapshot((snap)=>{
        if(!snap || !snap.data) return;
        if(currentItem && currentItem.id===id){
          const linkEl=document.getElementById("opLink"), notesEl=document.getElementById("opNotes");
          if(linkEl && document.activeElement!==linkEl) linkEl.value = snap.data.link||"";
          if(notesEl && document.activeElement!==notesEl) notesEl.value = snap.data.notes||"";
        }
        refreshDot(id);
      });
    }catch(e){ syncEl.classList.add("local"); syncTxt.textContent = "salvo só nesta sessão"; }
  } else {
    syncEl.classList.add("local"); syncTxt.textContent = "salvo só nesta sessão (sem conexão de dados)";
  }
  document.getElementById("opLink").value = data.link || "";
  document.getElementById("opNotes").value = data.notes || "";
}

async function saveNotes(id){
  const link = document.getElementById("opLink").value.trim();
  const notes = document.getElementById("opNotes").value.trim();
  localNotes[id] = {link, notes};
  refreshDot(id);
  if(dbCap){
    try{ await dbCap.doc("notes/"+id).set({link, notes, updatedAt: Date.now()}); }catch(e){}
  }
}

document.querySelectorAll("#themeToggle button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("#themeToggle button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    const t = b.dataset.t;
    if(t==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  };
});

function setupTodaySnap(){
  const todayItem = DAYS30.find(d=>dayStatus(d)==="hoje");
  const snap = document.getElementById("todaySnap");
  const txt = document.getElementById("todaySnapTxt");
  if(todayItem){
    const short = todayItem.title.length>36 ? todayItem.title.slice(0,36)+"…" : todayItem.title;
    txt.innerHTML = `Hoje · <b>${todayItem.fmt}</b> ${short}`;
    snap.onclick = ()=>{
      document.querySelector('.navlink[data-view="plano"]').click();
      openDetail(todayItem.id,"day");
    };
  } else {
    txt.textContent = "Hoje está fora do plano de 30 dias";
    snap.style.cursor = "default";
  }
}

function tickClock(){
  const el = document.getElementById("liveClock"); if(!el) return;
  const n = new Date();
  el.textContent = String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
}
